name: Build APK conte
on:
  push:
    paths: ['conte-app/**', '.github/workflows/conte-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Générer les voix (TTS neuronal FR)
        run: |
          pip install edge-tts
          cd conte-app/web
          node extract-lines.mjs
          python gen_voices.py lines.json ../android/app/src/main/assets/audio
      - name: Build APK
        working-directory: conte-app/android
        run: gradle assembleRelease --no-daemon
      - run: cp conte-app/android/app/build/outputs/apk/release/app-release.apk TroisPetitsCochons.apk
      - uses: actions/upload-artifact@v4
        with: { name: TroisPetitsCochons-apk, path: TroisPetitsCochons.apk }
      - name: Publier en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: conte-apk-${{ github.run_number }}
          name: APK Les Trois Petits Cochons (POC) #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: TroisPetitsCochons.apk
